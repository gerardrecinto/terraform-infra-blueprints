apiVersion: v1
kind: Pod
metadata:
  name: {{ include "web-service.fullname" . }}-test
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget", "-q", "-O", "-", "http://{{ include "web-service.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.readiness.path }}"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
