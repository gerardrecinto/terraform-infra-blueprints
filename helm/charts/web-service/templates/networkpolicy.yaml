{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- if and (not .Values.networkPolicy.ingressNamespaces) (not .Values.networkPolicy.ingressCIDRs) }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    - ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.egressExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
