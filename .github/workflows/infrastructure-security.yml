name: Infrastructure security contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    name: Security contracts (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: Azure/modules/aks
            mocked_tests: false
            scan: true
          - path: Azure/workflows/aks_enterprise
            mocked_tests: true
            scan: true
          - path: AWS/workflows/opensearch_migration
            mocked_tests: true
            scan: false
          - path: secure-connectivity/modules/nginx-public-service
            mocked_tests: true
            scan: false
          - path: AWS/modules/partition_aware_artifact_store
            mocked_tests: true
            scan: true
          - path: AWS/modules/ecs_fargate_service
            mocked_tests: true
            scan: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.9.8'
      - name: Check Terraform and test formatting
        run: terraform fmt -check -recursive "${{ matrix.path }}"
      - name: Initialize without a remote backend
        run: terraform -chdir="${{ matrix.path }}" init -backend=false -input=false
      - name: Validate provider configuration
        run: terraform -chdir="${{ matrix.path }}" validate -no-color
      - name: Exercise mocked provider security assertions
        if: matrix.mocked_tests
        run: terraform -chdir="${{ matrix.path }}" test -no-color
      - name: Block high and critical AKS misconfigurations
        if: matrix.scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.path }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  partition-arns:
    name: No hardcoded AWS partition in the partition-aware modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail on literal arn:aws: in module code
        run: |
          if grep -rn --include='*.tf' 'arn:aws:' AWS/modules/partition_aware_artifact_store/*.tf AWS/modules/ecs_fargate_service/*.tf; then
            echo 'Use arn:${local.partition}: so the module also plans in aws-us-gov'
            exit 1
          fi
          echo 'No hardcoded partition found'

  airgap-bundle:
    name: Air-gap bundle export, verify, import and tamper checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck the bundle scripts
        run: shellcheck -x on-prem/airgap-bundle/*.sh on-prem/istio-mtls-lab/run.sh
      - name: Install crane and cosign
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          CGO_ENABLED=0 go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the end-to-end proof
        run: on-prem/airgap-bundle/test.sh
