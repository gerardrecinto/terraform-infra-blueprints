name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-validate:
    name: Validate Terraform modules
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.x"

      - name: Check formatting
        run: |
          find . -name '*.tf' -not -path '*/.terraform/*' | xargs -I{} dirname {} | sort -u | while read dir; do
            terraform fmt -check -diff "$dir" || { echo "Format error in $dir"; exit 1; }
          done

      - name: Validate modules
        run: |
          for mod in AWS/modules/*/ Azure/modules/*/ GCP/modules/*/ AliCloud/modules/*/ OpenStack/modules/*/ on-prem/modules/*/ secure-connectivity/modules/*/; do
            echo "Validating $mod..."
            cd "$mod"
            terraform init -backend=false -input=false -no-color
            terraform validate -no-color
            cd - > /dev/null
          done

      - name: Check for hardcoded secrets
        run: |
          if grep -rn --include='*.tf' -E '(aws_access_key_id|aws_secret_access_key|password\s*=\s*"[^"]{8,}")' .; then
            echo 'ERROR: Potential hardcoded credentials found'
            exit 1
          fi
          echo 'No hardcoded credentials detected'

      - name: Trivy IaC misconfig scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  terragrunt-validate:
    name: Validate Terragrunt live units
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.x"

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Check formatting
        run: terragrunt hcl format --check --diff --working-dir live

      - name: Validate HCL syntax
        run: terragrunt hcl validate --working-dir live

      - name: Init and validate each unit (no backend, no real credentials needed)
        run: |
          find live -mindepth 1 -name terragrunt.hcl | xargs -I{} dirname {} | sort -u | while read unit; do
            echo "Validating $unit..."
            (cd "$unit" && terragrunt run -- init -backend=false -input=false -no-color \
              && terragrunt run -- validate -no-color)
          done

  helm-chart:
    name: Lint and test the Helm chart
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Lint
        run: helm lint helm/charts/web-service --strict

      - name: Render checks (pytest)
        run: python -m pytest helm/tests -v

      - name: Validate rendered manifests against the Kubernetes schemas
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template rel helm/charts/web-service --kube-version 1.31.0 --set ingress.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.31.0

  ansible-lint:
    name: Lint the Ansible playbook
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: pip install ansible-core==2.17.5 ansible-lint

      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook playbooks/k8s-rolling-node-upgrade.yml --syntax-check -e target_version=1.31.4

      - name: Lint (production profile)
        working-directory: ansible
        run: ansible-lint playbooks
