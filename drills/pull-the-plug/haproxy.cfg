global
  log stdout format raw local0

defaults
  mode http
  timeout connect 500ms
  timeout client  5s
  timeout server  2s

frontend www
  bind *:8080
  default_backend sites

backend sites
  option httpchk GET /healthz
  option redispatch
  retries 2
  default-server inter 1s fall 2 rise 2
  server dc-east dc-east:80 check
  server dc-west dc-west:80 check backup
