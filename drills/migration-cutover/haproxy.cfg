global
  log stdout format raw local0
  stats socket ipv4@127.0.0.1:9999 level admin

defaults
  mode http
  timeout connect 500ms
  timeout client  5s
  timeout server  2s

frontend www
  bind *:8080
  default_backend sites

backend sites
  balance roundrobin
  option httpchk GET /healthz
  option redispatch
  retries 2
  default-server inter 1s fall 2 rise 2
  server legacy legacy-app:80 check weight 100
  server cloud  cloud-app:80  check weight 0
